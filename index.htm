<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Thoughts</title>
  <meta name="description" content="Personal Thoughts and Interpretable Machine Learning notes.">

  <!-- Fonts: Fira Sans & Amiri (Arabic couplets) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Fira+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        packages: {'[+]': ['cancel']}
      },
      loader: {
        load: ['[tex]/cancel']
      },
      startup: {
        typeset: false
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root {
      /* Deep Warm Parchment / Gruvbox Light Soft Palette */
      --gb-bg-soft: #ebd9b4;
      --gb-bg-one:  #dec598;
      --gb-bg-two:  #b89b6e;
      --gb-fg-one:  #362c23;
      --gb-fg-zero: #211912;
      --gb-orange:  #9c2b00;
      --gb-yellow:  #8f5104;

      --paper:  #f2e5bc;
      --ink:    #3c3836;
      --muted:  #7c6f64;
      --rule:   #d5c4a1;
      --accent: #af3a03;
    }

    /* System Dark Mode */
    @media screen and (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --gb-bg-soft: #32302f;
        --gb-bg-one:  #282828;
        --gb-bg-two:  #504945;
        --gb-fg-one:  #ebdbb2;
        --gb-fg-zero: #fbf1c7;
        --gb-orange:  #fe8019;
        --gb-yellow:  #fabd2f;

        --paper:  #32302f;
        --ink:    #ebdbb2;
        --muted:  #a89984;
        --rule:   #504945;
        --accent: #fe8019;
      }
    }

    /* Manual Dark Mode Override */
    :root[data-theme="dark"] {
      --gb-bg-soft: #32302f;
      --gb-bg-one:  #282828;
      --gb-bg-two:  #504945;
      --gb-fg-one:  #ebdbb2;
      --gb-fg-zero: #fbf1c7;
      --gb-orange:  #fe8019;
      --gb-yellow:  #fabd2f;

      --paper:  #32302f;
      --ink:    #ebdbb2;
      --muted:  #a89984;
      --rule:   #504945;
      --accent: #fe8019;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    .top-bar {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 100;
      display: flex;
      gap: 0.45rem;
    }

    .ctrl-btn {
      background: var(--gb-bg-one);
      color: var(--gb-fg-zero);
      border: 1px solid var(--gb-bg-two);
      padding: 6px 12px;
      font-family: 'Fira Sans', sans-serif;
      font-size: 0.82rem;
      cursor: pointer;
      border-radius: 3px;
    }

    .ctrl-btn:hover {
      border-color: var(--gb-orange);
      color: var(--gb-orange);
    }

    #thoughts-view {
      background: var(--paper);
      color: var(--ink);
      font: 18px/1.65 Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    }

    #thoughts-view main {
      max-width: 48rem;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 5rem;
    }

    #thoughts-view header {
      margin-bottom: 3rem;
    }

    #thoughts-view h1 {
      font-size: 2.2rem;
      font-weight: normal;
      letter-spacing: -0.01em;
      margin: 0 0 0.4rem;
      color: var(--gb-fg-zero);
    }

    #thoughts-view header p {
      margin: 0;
      color: var(--muted);
      font-style: italic;
    }

    #thoughts-view .thought-counter {
      font: 0.75rem/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.2rem;
    }

    #thoughts-view .thought-counter strong {
      color: var(--accent);
      font-weight: normal;
    }

    #thoughts-view ol {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #thoughts-view li {
      padding: 1.8rem 0;
      border-top: 1px solid var(--rule);
    }

    #thoughts-view li:last-child {
      border-bottom: 1px solid var(--rule);
    }

    #thoughts-view time {
      display: block;
      font: 0.75rem/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }

    #thoughts-view li h3 {
      margin: 0 0 1.25rem;
      font-size: 1.35rem;
      font-weight: normal;
      color: var(--gb-fg-zero);
    }

    #thoughts-view li p {
      margin: 0 0 1rem;
    }

    #thoughts-view li p:last-child {
      margin-bottom: 0;
    }

    #thoughts-view em {
      color: var(--gb-fg-one);
    }

    #thoughts-view .aligned-prose {
      display: grid;
      grid-template-columns: 1fr max-content 1fr;
      gap: 12px 20px;
      direction: rtl;
      font-family: 'Amiri', 'Traditional Arabic', serif;
    }

    #thoughts-view .aligned-prose span:nth-child(3n + 1) {
      text-align: right;
    }

    #thoughts-view .dots {
      color: var(--muted);
      text-align: center;
    }

    #thoughts-view .aligned-prose span:nth-child(3n + 3) {
      text-align: left;
    }

    .highlight-assume {
      color: var(--gb-orange);
    }

    mjx-container[display="true"] {
      background-color: var(--gb-bg-soft);
      padding: 0.9rem 1.15rem;
      border-radius: 4px;
      border: 1px solid var(--rule);
      border-left: 3px solid var(--accent);
      overflow-x: auto;
      margin: 1.1rem 0 !important;
    }

    #thoughts-view footer {
      margin-top: 3rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .status-note {
      font-family: 'Fira Sans', sans-serif;
      font-size: 0.9rem;
      color: var(--muted);
      padding: 1.5rem 0;
    }
  </style>
</head>
<body>

  <div class="top-bar" role="group" aria-label="Page selector">
    <button id="toggle-page-btn" type="button" class="ctrl-btn" data-current="thoughts">
      Interpretable Machine Learning
    </button>
  </div>

  <div id="thoughts-view">
    <main>
      <header>
        <h1 id="page-title">Personal Thoughts</h1>
        <p id="page-subtitle">Small notes, kept for later.</p>
      </header>

      <p class="thought-counter">Entries: <strong id="thought-count">0</strong></p>

      <div id="content-slot">
        <p class="status-note">Loading content...</p>
      </div>

      <footer>Updated now and then.</footer>
    </main>
  </div>

  <script>
    const PAGES = {
      thoughts: {
        url: 'personal-thoughts.htm',
        title: 'Personal Thoughts',
        subtitle: 'Small notes, kept for later.',
        buttonLabel: 'Interpretable ML',
        hasMath: false
      },
      iml: {
        url: 'interpretable-machine-learning.htm',
        title: 'Interpretable Machine Learning',
        subtitle: 'First-principles notes on physical meanings and inferential mechanics.',
        buttonLabel: 'Personal Thoughts',
        hasMath: true
      }
    };

    const btn = document.getElementById('toggle-page-btn');
    const slot = document.getElementById('content-slot');
    const countEl = document.getElementById('thought-count');
    const titleEl = document.getElementById('page-title');
    const subtitleEl = document.getElementById('page-subtitle');

    async function importPage(key) {
      const cfg = PAGES[key];
      slot.innerHTML = '<p class="status-note">Importing content...</p>';

      try {
        const res = await fetch(cfg.url, { cache: 'no-cache' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const htmlText = await res.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');

        const sourceList = doc.querySelector('#prose-list');
        if (sourceList) {
          slot.replaceChildren(sourceList.cloneNode(true));
          countEl.textContent = slot.querySelectorAll('#prose-list > li').length;
        } else {
          const fallbackBody = doc.querySelector('main') || doc.body;
          slot.innerHTML = fallbackBody ? fallbackBody.innerHTML : htmlText;
          countEl.textContent = slot.querySelectorAll('li').length;
        }

        titleEl.textContent = cfg.title;
        subtitleEl.textContent = cfg.subtitle;
        document.title = cfg.title;
        btn.dataset.current = key;
        btn.textContent = cfg.buttonLabel;

        if (cfg.hasMath && window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
          await window.MathJax.typesetPromise([slot]);
        }
      } catch (err) {
        slot.innerHTML = `<p class="status-note">Could not load <code>${cfg.url}</code> (${err.message}). Serve over HTTP/HTTPS rather than <code>file://</code>.</p>`;
      }
    }

    btn.addEventListener('click', () => {
      const next = btn.dataset.current === 'thoughts' ? 'iml' : 'thoughts';
      importPage(next);
    });

    // Initial load
    importPage('thoughts');
  </script>
</body>
</html>
