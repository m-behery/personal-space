<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Thoughts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Fira+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script>
    (function () {
      const saved = localStorage.getItem('site-theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
  <style>
    :root {
      --gb-bg-soft: #ebd9b4;
      --gb-bg-one:  #dec598;
      --gb-bg-two:  #b89b6e;
      --gb-fg-one:  #362c23;
      --gb-fg-zero: #211912;
      --gb-orange:  #9c2b00;
      --gb-yellow:  #8f5104;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --gb-bg-soft: #32302f;
        --gb-bg-one:  #282828;
        --gb-bg-two:  #504945;
        --gb-fg-one:  #ebdbb2;
        --gb-fg-zero: #fbf1c7;
        --gb-orange:  #fe8019;
        --gb-yellow:  #fabd2f;
      }
    }

    :root[data-theme="dark"] {
      --gb-bg-soft: #32302f;
      --gb-bg-one:  #282828;
      --gb-bg-two:  #504945;
      --gb-fg-one:  #ebdbb2;
      --gb-fg-zero: #fbf1c7;
      --gb-orange:  #fe8019;
      --gb-yellow:  #fabd2f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    #content-slot main {
      max-width: 41rem;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 5rem;
    }
		
    #content-slot ol {
      padding-inline-start: 40px;
    }

    body {
      background: var(--gb-bg-soft);
      color: var(--gb-fg-one);
      font-family: 'Fira Sans', sans-serif;
      min-height: 100vh;
    }
		
    .top-controls {
      position: fixed;
      top: 14px;
      right: 18px;
      display: flex;
      gap: 8px;
      z-index: 100;
    }

    .ctrl-btn {
      background: var(--gb-bg-one);
      color: var(--gb-fg-zero);
      border: 1px solid var(--gb-bg-two);
      padding: 5px 10px;
      font-family: inherit;
      font-size: 0.82rem;
      cursor: pointer;
      border-radius: 3px;
    }

    .ctrl-btn:hover {
      border-color: var(--gb-orange);
      color: var(--gb-orange);
    }

    @media print {
      .top-controls { display: none; }
    }
  </style>
</head>
<body>
  <div class="top-controls">
    <button class="ctrl-btn" id="view-toggle" aria-label="Switch between Resume and Personal Thoughts">
      <i class="fa fa-exchange"></i> <span id="view-toggle-label">About</span>
    </button>
    <button class="ctrl-btn" id="theme-toggle" aria-label="Toggle color theme">
      <i class="fa fa-adjust"></i> Theme
    </button>
  </div>

  <main id="content-slot"></main>

  <script>
    const themeBtn = document.getElementById('theme-toggle');
    const viewBtn = document.getElementById('view-toggle');
    const viewLabel = document.getElementById('view-toggle-label');
    const slot = document.getElementById('content-slot');
    const root = document.documentElement;

    const FILES = {
      thoughts: 'personal-thoughts.htm',
      resume: 'about.htm'
    };

    const cache = {};
    let currentView = 'thoughts';

    themeBtn.addEventListener('click', () => {
      const isDark = root.getAttribute('data-theme') === 'dark' ||
        (!root.hasAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const next = isDark ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('site-theme', next);
    });

    async function importView(viewName) {
      const fileName = FILES[viewName];
      const targetUrl = new URL(fileName, window.location.href);

      if (!cache[viewName]) {
        const res = await fetch(targetUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status} for ${fileName}`);
        const raw = await res.text();
        const doc = new DOMParser().parseFromString(raw, 'text/html');

        const fragment = document.createDocumentFragment();

        doc.querySelectorAll('style').forEach((styleEl) => {
          const clone = document.createElement('style');
          clone.textContent = styleEl.textContent;
          fragment.appendChild(clone);
        });

        const bodyClone = doc.body.cloneNode(true);
        bodyClone
          .querySelectorAll('.top-controls, #theme-toggle, #view-toggle, #resume-toggle')
          .forEach((el) => el.remove());

        const scripts = Array.from(bodyClone.querySelectorAll('script'));
        scripts.forEach((s) => s.remove());

        while (bodyClone.firstChild) {
          fragment.appendChild(bodyClone.firstChild);
        }

        cache[viewName] = { fragment, scripts };
      }

      slot.innerHTML = '';
      slot.appendChild(cache[viewName].fragment.cloneNode(true));

      cache[viewName].scripts.forEach((oldScript) => {
        const newScript = document.createElement('script');
        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }
        slot.appendChild(newScript);
      });

      document.title = viewName === 'resume' ? 'About' : 'Personal Thoughts';
      viewLabel.textContent = viewName === 'resume' ? 'Personal Thoughts' : 'About';
      window.scrollTo(0, 0);
    }

    viewBtn.addEventListener('click', async () => {
      const nextView = currentView === 'thoughts' ? 'resume' : 'thoughts';
      try {
        await importView(nextView);
        currentView = nextView;
      } catch (err) {
        slot.innerHTML = `<p style="padding: 4rem 2rem;">Could not import <code>${FILES[nextView]}</code> (${err.message}).</p>`;
      }
    });

    // Default import on load: Personal Thoughts
    importView('thoughts').catch((err) => {
      slot.innerHTML = `<p style="padding: 4rem 2rem;">Could not import <code>${FILES.thoughts}</code> (${err.message}).</p>`;
    });
  </script>
</body>
</html>
