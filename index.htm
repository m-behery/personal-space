<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Thoughts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Fira+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script>
    (function () {
      const saved = localStorage.getItem('site-theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
  <style>
    :root {
      --gb-bg-soft: #ebd9b4;
      --gb-bg-one:  #dec598;
      --gb-bg-two:  #b89b6e;
      --gb-fg-one:  #362c23;
      --gb-fg-zero: #211912;
      --gb-orange:  #9c2b00;
      --gb-yellow:  #8f5104;

      --paper:  #f2e5bc;
      --ink:    #3c3836;
      --muted:  #7c6f64;
      --rule:   #d5c4a1;
      --accent: #af3a03;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --gb-bg-soft: #32302f;
        --gb-bg-one:  #282828;
        --gb-bg-two:  #504945;
        --gb-fg-one:  #ebdbb2;
        --gb-fg-zero: #fbf1c7;
        --gb-orange:  #fe8019;
        --gb-yellow:  #fabd2f;

        --paper:  #32302f;
        --ink:    #ebdbb2;
        --muted:  #a89984;
        --rule:   #504945;
        --accent: #fe8019;
      }
    }

    :root[data-theme="dark"] {
      --gb-bg-soft: #32302f;
      --gb-bg-one:  #282828;
      --gb-bg-two:  #504945;
      --gb-fg-one:  #ebdbb2;
      --gb-fg-zero: #fbf1c7;
      --gb-orange:  #fe8019;
      --gb-yellow:  #fabd2f;

      --paper:  #32302f;
      --ink:    #ebdbb2;
      --muted:  #a89984;
      --rule:   #504945;
      --accent: #fe8019;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--gb-bg-soft);
      color: var(--gb-fg-one);
      font-family: 'Fira Sans', sans-serif;
      min-height: 100vh;
    }

    /* Keep Personal Thoughts at its original width & list padding without narrowing About */
    #content-slot:has(#prose-list) #personal-thoughts-view,
    #content-slot:has(#prose-list) main {
      max-width: 45rem;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 5rem;
    }

    #content-slot #prose-list,
    #content-slot:has(#prose-list) ol {
      padding-inline-start: 40px;
    }

    /* Tighten clearance between sadr / ajuz and separator */
    #content-slot .aligned-prose {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content minmax(0, 1fr);
      column-gap: 10px;
      row-gap: 12px;
      align-items: baseline;
      direction: rtl;
      font-family: 'Amiri', 'Traditional Arabic', serif;
    }

    #content-slot .aligned-prose span:nth-child(3n + 1) {
      justify-self: end;
      text-align: right;
    }

    #content-slot .aligned-prose .dots {
      justify-self: center;
      text-align: center;
      white-space: nowrap;
      color: var(--muted);
    }

    #content-slot .aligned-prose span:nth-child(3n + 3) {
      justify-self: start;
      text-align: right;
    }

    .top-controls {
      position: fixed;
      top: 14px;
      right: 18px;
      display: flex;
      gap: 8px;
      z-index: 100;
    }

    .ctrl-btn {
      background: var(--gb-bg-one);
      color: var(--gb-fg-zero);
      border: 1px solid var(--gb-bg-two);
      padding: 5px 10px;
      font-family: inherit;
      font-size: 0.82rem;
      cursor: pointer;
      border-radius: 3px;
    }

    .ctrl-btn:hover {
      border-color: var(--gb-orange);
      color: var(--gb-orange);
    }

    .import-error {
      max-width: 41rem;
      margin: 0 auto;
      padding: 5rem 1.5rem;
    }

    @media print {
      .top-controls { display: none; }
    }
  </style>
</head>
<body>
  <div class="top-controls">
    <button class="ctrl-btn" id="view-toggle" aria-label="Switch between About and Personal Thoughts">
      <i class="fa fa-exchange"></i> <span id="view-toggle-label">About</span>
    </button>
    <button class="ctrl-btn" id="theme-toggle" aria-label="Toggle color theme">
      <i class="fa fa-adjust"></i> Theme
    </button>
  </div>

  <div id="content-slot"></div>

  <script>
    const themeBtn = document.getElementById('theme-toggle');
    const viewBtn = document.getElementById('view-toggle');
    const viewLabel = document.getElementById('view-toggle-label');
    const slot = document.getElementById('content-slot');
    const root = document.documentElement;

    const FILES = {
      'personal-thoughts': 'personal-thoughts.htm',
      about: 'about.htm'
    };

    const cache = {};
    let currentView = 'personal-thoughts';

    themeBtn.addEventListener('click', () => {
      const isDark = root.getAttribute('data-theme') === 'dark' ||
        (!root.hasAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const next = isDark ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('site-theme', next);
    });

    function scopeImportedCss(cssText) {
      return cssText.replace(/(^|[}\s,])body(?=\s*[,{])/g, '$1#content-slot');
    }

    function syncThoughtCounter() {
      const proseList = slot.querySelector('#prose-list');
      const thoughtCount = slot.querySelector('#thought-count');
      if (proseList && thoughtCount) {
        thoughtCount.textContent = proseList.querySelectorAll(':scope > li').length;
      }
    }

    async function importView(viewName) {
      const fileName = FILES[viewName];
      const targetUrl = new URL(fileName, window.location.href);

      if (!cache[viewName]) {
        const res = await fetch(targetUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const raw = await res.text();
        const doc = new DOMParser().parseFromString(raw, 'text/html');

        const styleTexts = Array.from(doc.querySelectorAll('style'))
          .map((styleEl) => scopeImportedCss(styleEl.textContent));

        const bodyClone = doc.body.cloneNode(true);
        bodyClone
          .querySelectorAll('.top-controls, #theme-toggle, #view-toggle, #resume-toggle, #about-toggle')
          .forEach((el) => el.remove());

        const scripts = Array.from(bodyClone.querySelectorAll('script'))
          .map((s) => ({ src: s.src || null, text: s.textContent }));
        bodyClone.querySelectorAll('script').forEach((s) => s.remove());

        cache[viewName] = {
          styleTexts,
          html: bodyClone.innerHTML,
          scripts
        };
      }

      const entry = cache[viewName];
      slot.innerHTML = '';

      entry.styleTexts.forEach((css) => {
        const styleEl = document.createElement('style');
        styleEl.textContent = css;
        slot.appendChild(styleEl);
      });

      const container = document.createElement('div');
      container.innerHTML = entry.html;
      while (container.firstChild) {
        slot.appendChild(container.firstChild);
      }

      entry.scripts.forEach((s) => {
        const scriptEl = document.createElement('script');
        if (s.src) {
          scriptEl.src = s.src;
        } else {
          scriptEl.textContent = s.text;
        }
        slot.appendChild(scriptEl);
      });

      syncThoughtCounter();

      document.title = viewName === 'about' ? 'About' : 'Personal Thoughts';
      viewLabel.textContent = viewName === 'about' ? 'Personal Thoughts' : 'About';
      window.scrollTo(0, 0);
    }

    viewBtn.addEventListener('click', async () => {
      const nextView = currentView === 'personal-thoughts' ? 'about' : 'personal-thoughts';
      try {
        await importView(nextView);
        currentView = nextView;
      } catch (err) {
        slot.innerHTML = `<div class="import-error"><p>Could not import <code>${FILES[nextView]}</code> (${err.message}). Make sure it is deployed next to <code>index.htm</code>.</p></div>`;
      }
    });

    importView('personal-thoughts').catch((err) => {
      slot.innerHTML = `<div class="import-error"><p>Could not import <code>${FILES['personal-thoughts']}</code> (${err.message}). Make sure it is deployed next to <code>index.htm</code>.</p></div>`;
    });
  </script>
</body>
</html>
